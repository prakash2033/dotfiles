# ~/.config/alacritty/alacritty.toml

[env]
TERM = "xterm-256color"

[window]
padding.x = 5
padding.y = 5
dynamic_padding = true
decorations = "full"
startup_mode = "Windowed"

[font.normal]
family = "Adwaita Mono"
style = "Regular"

[font.bold]
family = "Adwaita Mono"
style = "Bold"

[font.italic]
family = "Adwaita Mono"
style = "Italic"

[font.bold_italic]
family = "Adwaita Mono"
style = "Bold Italic"

[cursor.style]
shape = "Beam"
blinking = "On"

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"
