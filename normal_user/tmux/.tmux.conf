# -------- Settings{{{

# fix delay time between tmux & vim
set-option -sg escape-time 0

# mouse mode
set -g mouse on

# Sane scrolling
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

set-option -g default-terminal "xterm-256color"

set-option -g status-interval 1

set-option -g history-limit 500000

# vim mode
set-option -g mode-keys vi

# repeat time for resize panes
set -g repeat-time 1000

# }}}

# -------- Copy to clipboard {{{

# Use xclip to copy tmux buffer to X11 clipboard
if-shell 'test $XDG_SESSION_TYPE = x11' {
    bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe 'xclip -selection clipboard -i'
    bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard -i'
    bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'xclip -selection clipboard -i'
}

# Use wl-copy to copy tmux buffer to Wayland clipboard
if-shell 'test $XDG_SESSION_TYPE = wayland' {
    bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe 'wl-copy'
    bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
    bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'wl-copy'
}

# Use pbcopy to copy tmux buffer to macOS clipboard
if-shell 'uname | grep -q Darwin' {
    bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe 'pbcopy'
    bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
    bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
}

# }}}

# -------- Key Bindings {{{

# vimkeys for navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# change prefix key (avoid ctrl+a conflicts with gnu screen, emacs)
unbind-key C-Space
set-option -g prefix C-Space

# goto last used window
bind-key C-Space last-window

# kill window/pane without confirmation
bind-key & kill-window
bind-key x kill-pane

# Resize panes using Prefix + Shift + Vim keys
bind-key -r -T prefix  C-h  resize-pane -L 5
bind-key -r -T prefix  C-j  resize-pane -D 5
bind-key -r -T prefix  C-k  resize-pane -U 5
bind-key -r -T prefix  C-l  resize-pane -R 5
bind-key -r -T prefix  M-h  resize-pane -L 5
bind-key -r -T prefix  M-j  resize-pane -D 5
bind-key -r -T prefix  M-k  resize-pane -U 5
bind-key -r -T prefix  M-l  resize-pane -R 5

# Toggle Mouse Mode on/off
bind-key m set-option -g mouse \; display-message "Mouse mode is #{?mouse,on,off}"

# }}}

# -------- Layout {{{

bind-key a new-window -n rss -c $HOME \; \
  send-keys -t rss 'newsraft' 'Enter'\; \
  split-window -t rss -v \; \
  send-keys -t rss "$SPOOL -C && watch $SPOOL" 'Enter' \; \
  select-pane -t rss.0 \; \
  new-window -n music \; \
  send-keys -t music 'rmpc' 'Enter' \; \
  new-window -n spool -c $HOME \; \
  send-keys -t spool "$SPOOL -C && watch $SPOOL" 'Enter' \; \
  split-window -t spool -v \; \
  send-keys -t spool "TS_SOCKET=/tmp/fm $SPOOL -C && watch TS_SOCKET=/tmp/fm $SPOOL" 'Enter' \; \
  split-window -t spool -v \; \
  new-window -n wiki \; \
  send-keys -t wiki 'wikimd' 'Enter' \; \
  new-window -n btop \; \
  send-keys -t btop 'btop' 'Enter' \; \
  select-window -t "1" \; \
  select-window -t "0"
#}}}

# -------- Display Popup {{{

bind-key Tab capture-pane \; save-buffer /tmp/tmux-buffer \; delete-buffer \; display-popup -w 80% -h 60% -E "~/Public/gitrepo/shownotes/fzf_speed/fzf-speed"

#}}}

# -------- Reload config{{{

bind-key r source-file ~/.tmux.conf \; display-message "Configuration reloaded"

# }}}

# -------- The statusbar {{{

# various colors
set -g status-style fg=colour244
set -g window-status-current-style fg=colour2
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour2
set -g window-status-bell-style fg=colour1

set -g status-position bottom
set-option -g status-left-length 40

# Session #S:Session #I:Index #P: Pane
set-option -g status-left "[#S] "

# DateTime and Mouse Mode
set -g status-right '#(uptime -p) #{?mouse, 󰎀,}'
set -g status-right-length 60

# active window
setw -g window-status-current-format '#I:#W#F'

# inactive window
setw -g window-status-format '#I:#W#F'

# }}}

