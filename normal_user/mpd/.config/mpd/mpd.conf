# --- Required Paths ---
music_directory    "~/Music"
playlist_directory "~/.config/mpd/playlists"
db_file            "~/.config/mpd/database"
state_file         "~/.config/mpd/state"
sticker_file       "~/.config/mpd/sticker.sql"

# --- Network & Interaction ---
bind_to_address    "127.0.0.1"
port               "6600"
restore_paused     "yes"
auto_update        "yes"

# --- Audio Output (PipeWire/PulseAudio) ---
# Most modern systems (2024+) use PipeWire. 
# This block works for both PipeWire and PulseAudio.
audio_output {
    type            "pipewire"
    name            "PipeWire Sound Server"
}

# --- Optional: Visualizer Support ---
# Required if you use ncmpcpp's visualizer
# audio_output {
#     type            "fifo"
#     name            "Visualizer feed"
#     path            "/tmp/mpd.fifo"
#     format          "44100:16:2"
# }
audio_output {
   type   "fifo"
   name   "my_fifo"
   path   "/tmp/mpd.fifo"
   format "44100:16:2"
}
