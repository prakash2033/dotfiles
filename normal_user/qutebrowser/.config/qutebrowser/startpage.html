<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>start page</title>
  <style>
    :root {
      --background: #242729;
      --foreground: #dedede;

      --color0: #242729;
      --color1: #9c6b7a;
      --color2: #8a9887;
      --color3: #c4afa2;
      --color4: #8d96bd;
      --color5: #b694b6;
      --color6: #86a3a6;
      --color7: #c7c9cc;
      --color8: #44444c;
      --color9: #ae808f;
      --color10: #9aaa92;
      --color11: #e0cca8;
      --color12: #9da4c8;
      --color13: #d2aece;
      --color14: #9cb9c0;
      --color15: #dedede;
    }

    body {
      margin: 0;
      height: 100vh;
      background: var(--background) url('image.jpeg') no-repeat center center;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    nav {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.6em;
      max-width: 75vw;
    }
    a {
      background: var(--color0);
      border: 2px solid var(--color8);
      color: var(--foreground);
      padding: 2em 2.5em;
      text-decoration: none;
      font: 1.1em monospace;
      text-align: center;
      display: block;
    }
    a:hover {
      border-color: var(--color7);
    }
  </style>
</head>
<body>
  <nav>
    <a href="https://google.com">goog</a>
    <a href="https://github.com">ghb</a>
    <a href="https://chatgpt.com">gpt</a>
    <a href="https://claude.ai">clde</a>
    <a href="https://web.whatsapp.com">wa</a>
    <a href="https://www.reddit.com">rd</a>
    <a href="https://www.youtube.com">yt</a>
    <a href="https://www.facebook.com">fa</a>
    <a href="https://outlook.live.com">out</a>
    <a href="https://mail.google.com/mail">gml</a>
    <a href="https://qutebrowser.org/doc/quickstart.html">qt</a>
    <a href="https://github.com/prakash2033/dotfiles">dot</a>
  </nav>
</body>
</html>
